<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Minecraft Mapping Tool</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1e1e1e;
    }

    #map {
      height: 100vh;
      width: 100vw;
      background-color: #1e1e1e;
    }

    /* Keeps zoomed-in blocks sharp and pixel-perfect */
    .leaflet-tile {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const commonLayerOptions = {
      tileSize: 256,
      noWrap: true,
      minZoom: -4,          // Allows zooming out to see the entire map
      maxZoom: 4,           // Allows zooming in ultra-close to inspect single blocks
      minNativeZoom: -3,    // Uses downsampled tiles generated by Rust for zooming out
      maxNativeZoom: 0,     // Upscales Native Zoom 0 tiles using GPU pixelated interpolation
      errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
    };

    const colorMap = L.tileLayer('/tiles/{z}/{x}/{y}.png', commonLayerOptions);
    const heightMap = L.tileLayer('/tiles_height/{z}/{x}/{y}.png', commonLayerOptions);

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -4,
      maxZoom: 4,
      layers: [colorMap],
      fadeAnimation: false,
      zoomAnimation: false,
      markerZoomAnimation: false,
      wheelPxPerZoomLevel: 90
    });

    L.control.layers({
      "Color Map": colorMap,
      "Height Map": heightMap
    }).addTo(map);

    map.setView([-1000, 1000], 0);
  </script>
</body>

</html>
