<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Minecraft Mapping Tool</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1e1e1e;
    }

    #map {
      height: 100vh;
      width: 100vw;
      background-color: #1e1e1e;
    }

    .leaflet-tile {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .dimension-control {
      background: #2b2b2b;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      font-family: sans-serif;
      font-size: 14px;
    }

    .dimension-control select {
      background: #3c3c3c;
      color: #fff;
      border: 1px solid #555;
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let currentDimension = 'overworld';
    let playerMarkers = {};
    const commonLayerOptions = {
      tileSize: 256,
      noWrap: true,
      minZoom: -4,
      maxZoom: 4,
      minNativeZoom: -3,
      maxNativeZoom: 0,
      errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
    };

    let colorMap = L.tileLayer(`/tiles/${currentDimension}/{z}/{x}/{y}.webp`, commonLayerOptions);
    let heightMap = L.tileLayer(`/tiles_height/${currentDimension}/{z}/{x}/{y}.webp`, commonLayerOptions);
    let playerLayerGroup = L.layerGroup();
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -4,
      maxZoom: 4,
      layers: [colorMap, playerLayerGroup],
      fadeAnimation: true,
      zoomAnimation: true,
      markerZoomAnimation: false,
      wheelPxPerZoomLevel: 90,
      zoomSnap: 0,
      zoomDelta: 0.5,
    });

    const layerControl = L.control.layers(
      { "Color Map": colorMap, "Height Map": heightMap },
      { "Players": playerLayerGroup }
    ).addTo(map);

    map.setView([-128, 128], 0);

    function updatePlayerMarkers(players) {
        const currentUuids = new Set();

        players.forEach(player => {
          if (player.dimension !== currentDimension) return;
          currentUuids.add(player.uuid);
          const latLng = [-player.z, player.x];

          if (playerMarkers[player.uuid]) {
            playerMarkers[player.uuid].setLatLng(latLng);
          } else {
            const marker = L.marker(latLng, {
              title: player.name,
              icon: L.divIcon({
                className: 'player-marker',
                html: `<div style="background:#00ffcc; border:2px solid #000; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:11px; white-space:nowrap; color:#000;">👤 ${player.name}</div>`,
                iconSize: [60, 20],
                iconAnchor: [30, 10]
              })
            });
            marker.addTo(playerLayerGroup);
            playerMarkers[player.uuid] = marker;
          }
        });
        Object.keys(playerMarkers).forEach(uuid => {
          if (!currentUuids.has(uuid)) {
            playerLayerGroup.removeLayer(playerMarkers[uuid]);
            delete playerMarkers[uuid];
          }
        });
      }
      const evtSource = new EventSource("/sse");
      evtSource.onmessage = function (event) {
        const data = JSON.parse(event.data);
        if (data.type === "tile_update" || data.dim) {
          if (data.dim !== currentDimension) return;
          const tileBaseUrl = `/tiles/${data.dim}/${data.z}/${data.x}/${data.y}.webp`;
          const heightBaseUrl = `/tiles_height/${data.dim}/${data.z}/${data.x}/${data.y}.webp`;
          const tileImages = document.querySelectorAll(`img[src^="${tileBaseUrl}"], img[src^="${heightBaseUrl}"]`);
          const timestamp = new Date().getTime();
          tileImages.forEach(img => {
            const baseSrc = img.src.split('?')[0];
            img.src = `${baseSrc}?t=${timestamp}`;
          });
        }
        else if (data.type === "player_update") {
          updatePlayerMarkers(data.players);
        }
      };
      document.getElementById('dimSelect').addEventListener('change', (e) => {
        currentDimension = e.target.value;
        colorMap.setUrl(`/tiles/${currentDimension}/{z}/{x}/{y}.webp`);
        heightMap.setUrl(`/tiles_height/${currentDimension}/{z}/{x}/{y}.webp`);
        playerLayerGroup.clearLayers();
        playerMarkers = {};
      });
    const DimensionControl = L.Control.extend({
      options: {position: 'topright'},
      onAdd: function () {
        const div = L.DomUtil.create('div', 'dimension-control');
        div.innerHTML = `
          <label for="dimSelect"><b>World: </b></label>
          <select id="dimSelect">
            <option value="overworld">Overworld</option>
            <option value="the_nether">The Nether</option>
            <option value="the_end">The End</option>
          </select>
        `;
        L.DomEvent.disableClickPropagation(div);
        return div;
      }
    });

    map.addControl(new DimensionControl());
    evt.Source.onerror = function (err) {
      console.error("SSE connection lost. Reconnecting automatically...", err);
    };
    document.getElementById('dimSelect').addEventListener('change', (e) => {
      currentDimension = e.target.value;
      colorMap.setUrl(`/tiles/${currentDimension}/{z}/{x}/{y}.webp`);
      heightMap.setUrl(`/tiles_height/${currentDimension}/{z}/{x}/{y}.webp`);
      playerLayerGroup.clearLayers();
      playerMarkers = {};
    });
  </script>
</body>

</html>
