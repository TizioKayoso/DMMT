[package]
name = "minecraft_map"
version = "0.1.0"
edition = "2024"

[dependencies]
fastnbt = "2.6.3"
flate2 = "1.1.9"
image = { version = "0.25.10", features = ["webp"] }
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
phf = { version = "0.11", features = ["macros"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde_json = "1.0.151"

[build-dependencies]
cc = "1"
